name: Update stats card
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download card
        run: |
          curl -fsSL --retry 5 --retry-delay 20 \
            "https://github-readme-stats.vercel.app/api?username=nayush-ghimire&show_icons=true&theme=highcontrast" \
            -o stats.tmp || true
          if grep -q "<svg" stats.tmp && ! grep -qi "something went wrong" stats.tmp; then
            mv stats.tmp github-stats.svg
          fi
      - name: Commit
        run: |
          [ -f github-stats.svg ] || exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add github-stats.svg
          git diff --cached --quiet || git commit -m "Update stats card"
          git push
